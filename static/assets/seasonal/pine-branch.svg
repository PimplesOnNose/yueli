<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Pine branch (松枝) — Winter — Water element -->
  <g stroke="#5a8e9e" stroke-width="1.2" fill="none" stroke-linecap="round">
    <!-- Main branch -->
    <path d="M15 85 Q35 65 55 50 Q65 42 75 35"/>
    <!-- Needle clusters (pine needles radiate from branch) -->
    <!-- Cluster 1 -->
    <line x1="35" y1="65" x2="30" y2="58"/>
    <line x1="35" y1="65" x2="38" y2="57"/>
    <line x1="35" y1="65" x2="32" y2="55"/>
    <!-- Cluster 2 -->
    <line x1="50" y1="52" x2="45" y2="45"/>
    <line x1="50" y1="52" x2="53" y2="44"/>
    <line x1="50" y1="52" x2="47" y2="42"/>
    <line x1="50" y1="52" x2="55" y2="48"/>
    <!-- Cluster 3 -->
    <line x1="65" y1="42" x2="60" y2="35"/>
    <line x1="65" y1="42" x2="68" y2="34"/>
    <line x1="65" y1="42" x2="62" y2="32"/>
    <!-- Cluster 4 -->
    <line x1="75" y1="35" x2="70" y2="28"/>
    <line x1="75" y1="35" x2="78" y2="27"/>
    <line x1="75" y1="35" x2="73" y2="25"/>
    <line x1="75" y1="35" x2="80" y2="30"/>
    <!-- Small branch -->
    <path d="M50 52 Q55 48 60 50"/>
  </g>
</svg>
